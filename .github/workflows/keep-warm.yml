name: Keep GridVoice warm

on:
  schedule:
    # Every 5 minutes (GitHub's minimum). Runs can be delayed under load.
    - cron: "*/5 * * * *"
  # Lets you trigger a run manually from the Actions tab to test it
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping GridVoice health endpoint
        run: |
          curl -fsS --max-time 90 \
            --retry 3 --retry-delay 20 --retry-all-errors \
            https://gridvoice.app/api/health
